name: mermaid_bench
description: Coverage and speed of Mermaid layout over a corpus of real diagrams. Not part of the app.
publish_to: none
environment:
  sdk: ^3.13.5
dependencies:
  mermaid_core: 0.3.2
  # Only for the files under app/lib/ui/render/mermaid/ that are pure Dart.
  # Resolving it needs the Flutter SDK on PATH (`dart pub get` finds it).
  herdr_mobile:
    path: ../../app
