[package]
name = "herdr-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Terminal client for a herdr-mobile keeper session (replaces the python `view`)"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde_json.workspace = true
acp.workspace = true
keeper = { path = "../keeper" }
unicode-width = "0.2"
signal-hook = "0.3"
rustix = { version = "0.38", default-features = false, features = ["std", "termios"] }
pulldown-cmark = { version = "0.12", default-features = false }

# Small on purpose: a viewer left open in a pane for days must stay in the low MBs.

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
